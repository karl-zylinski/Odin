<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Karl2D Playground</title>
		<style>
			html, body { height: 100%; margin: 0; background: #1e1e1e; color: #d4d4d4; font-family: sans-serif; }
			body { display: flex; flex-direction: column; }
			header { display: flex; align-items: center; gap: 12px; padding: 8px 12px; background: #2d2d2d; }
			header h1 { font-size: 16px; margin: 0 12px 0 0; }
			select { background: #1e1e1e; color: #d4d4d4; border: 1px solid #444; padding: 4px 6px; font-size: 14px; }
			button { background: #0e639c; color: white; border: none; padding: 6px 16px; font-size: 14px; cursor: pointer; }
			button:disabled { background: #555; }
			#status { flex: 1; font-size: 13px; color: #aaa; }
			main { flex: 1; display: flex; min-height: 0; }
			#left { flex: 0 0 50%; display: flex; flex-direction: column; min-width: 0; }
			#editor { flex: 1; min-height: 0; }
			/* Drag to give the editor or the game more room, double click to even them out */
			#divider { flex: none; width: 5px; background: #444; cursor: col-resize; }
			#divider:hover, #divider.dragging { background: #0e639c; }
			#right { flex: 1; display: flex; flex-direction: column; min-width: 0; }
			#game { flex: 1; border: none; background: black; min-height: 0; }
			#console { margin: 0; padding: 8px; max-height: 30%; overflow: auto; font-family: monospace; font-size: 13px; white-space: pre-wrap; color: #f88; border-top: 1px solid #444; }
			#console:empty { display: none; }

			/* The editor: a transparent textarea over a highlighted <pre>, see editor.js.
			   Both layers must use the same font metrics and the same padding. */
			.ed { display: flex; overflow: hidden; background: #1e1e1e; font-family: monospace; font-size: 14px; line-height: 20px; tab-size: 4; }
			.ed-gutter { position: relative; flex: none; overflow: hidden; padding: 0 8px; background: #252526; color: #6e7681; user-select: none; }
			.ed-numbers { position: absolute; left: 8px; right: 8px; top: 0; padding: 8px 0; text-align: right; white-space: pre; }
			.ed-errnum { color: #f88; }
			.ed-wrap { position: relative; flex: 1; min-width: 0; overflow: hidden; }
			.ed-errors { position: absolute; left: 0; right: 0; top: 8px; pointer-events: none; }
			.ed-errline { position: absolute; left: 0; right: 0; height: 20px; background: rgba(255, 80, 80, 0.12); border-left: 2px solid #a33; }
			.ed-code, .ed-input { margin: 0; padding: 8px; font-family: inherit; font-size: inherit; line-height: inherit; tab-size: inherit; white-space: pre; }
			.ed-code { position: absolute; left: 0; top: 0; color: #d4d4d4; pointer-events: none; }
			.ed-input { position: absolute; inset: 0; width: 100%; height: 100%; box-sizing: border-box; border: none; outline: none; resize: none; overflow: auto; background: transparent; color: transparent; caret-color: #d4d4d4; }
			/* The textarea's own text is transparent, so the selection has to be
			   translucent for the colours of the layer behind to show through */
			.ed-input::selection { background: rgba(70, 130, 200, 0.45); }
			.ed-com { color: #6a9955; }
			.ed-str { color: #ce9178; }
			.ed-num { color: #b5cea8; }
			.ed-kw  { color: #569cd6; }
			.ed-ty  { color: #4ec9b0; }
			.ed-fn  { color: #dcdcaa; }
			.ed-dir { color: #c586c0; }
			.ed-pkg { color: #9cdcfe; }

			/* The example's files, below the editor */
			#files { flex: none; max-height: 152px; overflow-y: auto; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 4px; padding: 6px; border-top: 1px solid #444; background: #232323; }
			.file { width: 76px; padding: 2px; border: 1px solid transparent; text-align: center; font-size: 11px; color: #aaa; }
			.file.open { border-color: #0e639c; background: #2d2d2d; color: #d4d4d4; }
			.file.source { cursor: pointer; }
			.file.source:hover { border-color: #666; }
			.file-thumb { display: flex; align-items: center; justify-content: center; height: 48px; background: #1b1b1b; border: 1px solid #3c3c3c; overflow: hidden; }
			.file-thumb img { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; }
			.file-ext { font-family: monospace; font-size: 12px; color: #9cdcfe; }
			.file-size { display: block; color: #777; }
			.file-name { display: block; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
		</style>
	</head>
	<body>
		<header>
			<h1>Karl2D Playground</h1>
			<select id="example" disabled></select>
			<button id="run" disabled>Run (Ctrl+Enter)</button>
			<span id="status">Loading compiler...</span>
		</header>
		<main>
			<div id="left">
				<div id="editor"></div>
				<div id="files"></div>
			</div>
			<div id="divider" title="Drag to resize"></div>
			<div id="right">
				<iframe id="game" title="Game"></iframe>
				<pre id="console"></pre>
			</div>
		</main>
		<script type="text/javascript" src="editor.js"></script>
		<script type="text/javascript" src="karl2d_playground.js"></script>
	</body>
</html>
