<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Odin Playground</title>
		<style>
			html, body { height: 100%; margin: 0; background: #1e1e1e; color: #d4d4d4; font-family: sans-serif; }
			body { display: flex; flex-direction: column; }
			header { display: flex; align-items: center; gap: 12px; padding: 8px 12px; background: #2d2d2d; }
			header h1 { font-size: 16px; margin: 0 12px 0 0; }
			header input { flex: 1; background: #1e1e1e; color: #d4d4d4; border: 1px solid #444; padding: 4px 6px; font-family: monospace; }
			button { background: #0e639c; color: white; border: none; padding: 6px 16px; font-size: 14px; cursor: pointer; }
			button:disabled { background: #555; }
			#status { min-width: 160px; font-size: 13px; color: #aaa; }
			main { flex: 1; display: flex; min-height: 0; }
			#source { flex: 1; resize: none; border: none; outline: none; padding: 8px; background: #1e1e1e; color: #d4d4d4; font-family: monospace; font-size: 14px; tab-size: 4; white-space: pre; }
			#right { flex: 1; display: flex; flex-direction: column; min-width: 0; border-left: 1px solid #444; }
			#console { flex: 1; margin: 0; padding: 8px; overflow: auto; font-family: monospace; font-size: 13px; white-space: pre-wrap; }
			#compiler-output { color: #f88; }
			#webgl-canvas { display: none; width: 100%; background: black; }
		</style>
	</head>
	<body>
		<header>
			<h1>Odin Playground</h1>
			<button id="run" disabled>Run (Ctrl+Enter)</button>
			<label>Flags <input id="flags" value="-target:js_wasm32"></label>
			<span id="status">Loading compiler...</span>
		</header>
		<main>
			<textarea id="source" spellcheck="false"></textarea>
			<div id="right">
				<pre id="console"><span id="compiler-output"></span><span id="program-output"></span></pre>
				<canvas id="webgl-canvas" width="640" height="360"></canvas>
			</div>
		</main>
		<script type="text/javascript" src="odin.js"></script>
		<script type="text/javascript" src="playground.js"></script>
	</body>
</html>
